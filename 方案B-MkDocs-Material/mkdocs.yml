site_name: 熊的 AI 项目札记
site_description: 记录 AI、GitHub 项目与体外诊断试剂研发工程学习历程
site_author: 熊
site_url: https://xiongweijin.github.io/vcp-knowledge-site/
repo_url: https://github.com/xiongweijin/vcp-knowledge-site
repo_name: xiongweijin/vcp-knowledge-site

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.share
    - content.code.copy
  palette:
    - scheme: default
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - scheme: slate
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

plugins:
  - search:
      lang:
        - zh
        - en

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/giscus.js

extra:
  giscus:
    enabled: true
    repo: "xiongweijin/vcp-knowledge-site"
    repo_id: "R_kgDOSfvpNA"
    category: "General"
    category_id: "DIC_kwDOSfvpNM4C9O0-"
    mapping: "pathname"
    reactions_enabled: "1"
    input_position: "bottom"
    lang: "zh-CN"
    theme: "preferred_color_scheme"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - 研究项目:
      - 项目首页: index.md
      - 01-VCP 系统解读:
          - vcp-system/index.md
          - 系统全景: vcp-system/01-system-overview.md
          - 变量与占位符体系: vcp-system/02-placeholders.md
          - 上下文折叠体系: vcp-system/03-context-folding.md
          - 记忆系统: vcp-system/04-memory.md
          - 工具调用协议: vcp-system/05-tool-protocol.md
          - 插件生态: vcp-system/06-plugins.md
          - Agent 提示词工程: vcp-system/07-agent-prompt.md
          - 消息处理管线: vcp-system/08-message-pipeline.md
          - 多 Agent 协同体系: vcp-system/09-multi-agent.md
          - 分布式与安全: vcp-system/10-distributed-security.md
          - Agent 配置建议: vcp-system/11-agent-config.md
          - 提示词架构优化方案: vcp-system/12-prompt-architecture.md
          - VCP 系统深度导读: vcp-system/14-deep-guide.md
          - VCP 概念学习手册: vcp-system/15-human-guide.md
          - VCP 源码导航与运维手册: vcp-system/16-agent-ops-guide.md
  - 关于熊: about.md
